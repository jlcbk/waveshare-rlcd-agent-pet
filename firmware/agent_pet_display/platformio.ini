[platformio]
default_envs = waveshare_rlcd

[env:waveshare_rlcd]
; Pinned to what built the June firmware (Arduino-ESP32 2.0.17 / IDF 4.4.7).
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  olikraus/U8g2@2.36.18

; Round 3: PM-enabled rebuild of the same 2.0.17 SDK libs. PlatformIO's
; file:// package mechanism overwrites the global framework slot, so these
; environments expect the swap script to have been run first:
;   tools/pm-libs/use-pm-sdk.sh pm     # before building _pm / _pmoff
;   tools/pm-libs/use-pm-sdk.sh stock  # to restore the stock SDK afterwards
[env:waveshare_rlcd_pm]
extends = env:waveshare_rlcd

; A/B control build: identical PM SDK and code, light sleep compiled out.
[env:waveshare_rlcd_pmoff]
extends = env:waveshare_rlcd_pm
build_flags =
  ${env:waveshare_rlcd.build_flags}
  -D RLCD_PM_DISABLE_LIGHT_SLEEP=1

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
  -<*>
  +<bridge_client.cpp>
  +<battery_monitor.cpp>
  +<button_actions.cpp>
  +<doto_font.cpp>
  +<focus_controller.cpp>
  +<pet_sprites.cpp>
  +<pet_state_machine.cpp>
  +<screen_layout.cpp>
  +<usage_visuals.cpp>
  +<clock_model.cpp>
  +<time_keeper.cpp>
  +<device_settings.cpp>
  +<anim_codec.cpp>
  +<poll_policy.cpp>
  +<pm_controller.cpp>
lib_deps =
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -std=gnu++17
